<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricochet — Nathan Collard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1622;--bg2:#172533;--bg3:#1e3245;--bg4:#243b52;
  --grn:#00e701;--gdn:#00b800;--gbg:rgba(0,231,1,.10);
  --red:#e74c3c;--rbg:rgba(231,76,60,.10);
  --txt:#c2d4e0;--dim:#4a6a7a;--bdr:rgba(255,255,255,.07);
  --amb:#f5a623;--abg:rgba(245,166,35,.12)
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.logo{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--grn);margin-bottom:2rem;opacity:.55}
.shell{width:100%;max-width:680px;background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;border-bottom:1px solid var(--bdr);background:var(--bg)}
.balgrp{display:flex;align-items:center;gap:10px}
.ballbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.balval{font-size:15px;font-weight:700;color:#fff}
.balval span{color:var(--grn)}
.snd{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--dim);cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s,color .12s}
.snd:hover{background:var(--bg4);color:var(--txt)}
.cvarea{position:relative;height:270px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ro{position:absolute;top:34%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.ro.show{opacity:1}
.rmult{font-size:3rem;font-weight:700;line-height:1}
.rmult.w{color:var(--grn);text-shadow:0 0 22px rgba(0,231,1,.45)}
.rmult.l{color:var(--red);text-shadow:0 0 22px rgba(231,76,60,.45)}
.rsub{font-size:12px;font-weight:600;margin-top:5px}
.rsub.w{color:var(--grn)}.rsub.l{color:var(--red)}
.ctrls{padding:1.2rem 1.25rem;display:flex;flex-direction:column;gap:.9rem}
.crow{display:flex;gap:.75rem;align-items:flex-start}
.cblk{flex:1}
.clbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.bwrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:0 10px;height:40px;gap:6px;transition:border-color .15s}
.bwrap:focus-within{border-color:rgba(0,231,1,.35)}
.cur{font-size:12px;color:var(--dim);font-weight:500}
input[type=number]{background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;width:100%}
input[type=number]::-webkit-inner-spin-button{display:none}
.bbtns{display:flex;gap:4px;margin-top:5px}
.bbtn{flex:1;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--dim);font-size:11px;font-family:'Inter',sans-serif;padding:4px 0;cursor:pointer;transition:background .12s,color .12s}
.bbtn:hover{background:var(--bg4);color:var(--txt)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:relative}
.dbtn{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:7px 4px;text-align:center;cursor:pointer;transition:all .12s}
.dbtn:hover{border-color:rgba(0,231,1,.25);background:var(--bg3)}
.dbtn.act{border-color:var(--grn);background:var(--gbg)}
.dname{font-size:11px;font-weight:700;color:#fff;display:block}
.dbtn.act .dname{color:var(--grn)}
.dinfo{font-size:10px;color:var(--dim);display:block;margin-top:2px}
.dbtn.act .dinfo{color:rgba(0,231,1,.55)}
.lrow{display:flex;gap:8px;align-items:stretch}
.lbtn{flex:1;height:46px;background:var(--grn);color:#000;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;border:none;border-radius:8px;cursor:pointer;letter-spacing:.04em;transition:background .12s,transform .08s}
.lbtn:hover:not(:disabled){background:var(--gdn)}
.lbtn:active:not(:disabled){transform:scale(.985)}
.lbtn:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}
.fbtn{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:0 14px;font-size:11px;font-weight:700;color:var(--dim);font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:all .12s}
.fbtn:hover{background:var(--bg3);color:var(--txt)}
.fbtn.on{border-color:var(--amb);background:var(--abg);color:var(--amb)}
.srow{display:flex;gap:6px;padding:0 1.25rem 1rem}
.stat{flex:1;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:.55rem .75rem;text-align:center}
.slbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.sval{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.sval.g{color:var(--grn)}.sval.r{color:var(--red)}
.hist{padding:0 1.25rem 1.2rem}
.hlbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.hlist{display:flex;gap:5px;flex-wrap:wrap}
.hp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.hp.w{background:var(--gbg);color:var(--grn)}
.hp.l{background:var(--rbg);color:var(--red)}
.tt{position:fixed;background:rgba(0,10,20,0.92);color:#c2d4e0;font-size:11px;font-family:'Inter',sans-serif;padding:5px 10px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:999;border:1px solid rgba(0,231,1,.3)}
.tt.show{opacity:1}
</style>
</head>
<body>
<div class="logo">
  <a id="backBtn" href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:rgba(194,212,224,.5);font-size:11px;text-decoration:none;letter-spacing:.08em;transition:color .15s" onmouseenter="this.style.color='#00e701'" onmouseleave="this.style.color='rgba(194,212,224,.5)'" onclick="saveAndBack(event)">
    ← Portfolio
  </a>
  <span style="color:rgba(255,255,255,.12);margin:0 8px">|</span>
  Nathan Collard
</div>
<div id="tt" class="tt"></div>
<div class="shell">
  <div class="topbar">
    <div class="balgrp">
      <span class="ballbl">Balance</span>
      <span class="balval"><span id="bal">1 000</span> €</span>
    </div>
    <button class="snd" id="sndBtn" onclick="toggleSnd()">Son ON</button>
  </div>
  <div class="cvarea">
    <canvas id="gc"></canvas>
    <div class="ro" id="ro">
      <div class="rmult" id="rm"></div>
      <div class="rsub"  id="rs"></div>
    </div>
  </div>
  <div class="ctrls">
    <div class="crow">
      <div class="cblk">
        <div class="clbl">Mise</div>
        <div class="bwrap"><span class="cur">€</span><input type="number" id="bi" value="10" min="1" step="1"></div>
        <div class="bbtns">
          <button class="bbtn" onclick="adj(.5)">½</button>
          <button class="bbtn" onclick="adj(2)">×2</button>
          <button class="bbtn" onclick="adj(10)">×10</button>
          <button class="bbtn" onclick="allIn()">All-in</button>
        </div>
      </div>
      <div class="cblk">
        <div class="clbl">Difficulté</div>
        <div class="dgrid" id="dg"></div>
      </div>
    </div>
    <div class="lrow">
      <button class="lbtn" id="lb" onclick="launch()">Lancer le pari</button>
      <button class="fbtn" id="fb" onclick="toggleFast()">Pari rapide</button>
    </div>
  </div>
  <div class="srow">
    <div class="stat"><div class="slbl">Parties</div><div class="sval" id="sg">0</div></div>
    <div class="stat"><div class="slbl">Victoires</div><div class="sval g" id="sw">0</div></div>
  </div>
  <div class="hist">
    <div class="hlbl">Historique</div>
    <div class="hlist" id="hl"></div>
  </div>
</div>

function ensureAC(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}
  if(AC.state==='suspended')AC.resume();
  if(!ploufBuf)loadPlouf();
}
function b64ToAB(b64){
  const bin=atob(b64),buf=new ArrayBuffer(bin.length),view=new Uint8Array(buf);
  for(let i=0;i<bin.length;i++)view[i]=bin.charCodeAt(i);
  return buf;
}
function loadPlouf(){
  AC.decodeAudioData(b64ToAB(PLOUF_B64)).then(buf=>{ploufBuf=buf;}).catch(()=>{});
}
function playPlouf(){
  if(!sndOn||!AC||!ploufBuf)return;
  const src=AC.createBufferSource(),g=AC.createGain();
  src.buffer=ploufBuf;g.gain.value=0.9;
  src.connect(g);g.connect(AC.destination);src.start(AC.currentTime);
}
function bounceSound(n){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  const f=1100*Math.pow(.70,n);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.20,t+.10);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.13);
  const sr=AC.sampleRate,bl=Math.floor(sr*.08),buf=AC.createBuffer(1,bl,sr),d=buf.getChannelData(0);
  for(let i=0;i<bl;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/bl*14);
  const ns=AC.createBufferSource();ns.buffer=buf;
  const fl=AC.createBiquadFilter();fl.type='bandpass';
  fl.frequency.value=Math.max(160,750*Math.pow(.65,n));fl.Q.value=1.2;
  const ng=AC.createGain();ng.gain.setValueAtTime(.22,t);ng.gain.exponentialRampToValueAtTime(.001,t+.09);
  ns.connect(fl);fl.connect(ng);ng.connect(AC.destination);ns.start(t);ns.stop(t+.09);
}
function winSound(mult){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  const big=mult>=10;
  const freqs=big?[523,659,784,1047,1319]:[523,659,784,1047];
  freqs.forEach((f,i)=>{
    const st2=t+i*.07;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=i===freqs.length-1?'triangle':'sine';
    o.frequency.setValueAtTime(f,st2);
    g.gain.setValueAtTime(0,st2);
    g.gain.linearRampToValueAtTime(big?.28:.22,st2+.03);
    g.gain.exponentialRampToValueAtTime(.001,st2+.45+i*.04);
    o.connect(g);g.connect(AC.destination);o.start(st2);o.stop(st2+.55);
  });
  if(big){
    // Extra bass hit
    const bo=AC.createOscillator(),bg=AC.createGain();
    bo.type='sine';bo.frequency.setValueAtTime(110,t);
    bo.frequency.exponentialRampToValueAtTime(55,t+.3);
    bg.gain.setValueAtTime(.35,t);bg.gain.exponentialRampToValueAtTime(.001,t+.35);
    bo.connect(bg);bg.connect(AC.destination);bo.start(t);bo.stop(t+.4);
  }
}

const cv=document.getElementById('gc'),c=cv.getContext('2d');
let W,H,lX,lY,lRX,lRY,wt=0,iid;
let gPatch=[],reedD=[],lilyD=[],fishD=[],treeData=[];
let cloudWind=0,splashParticles=[];

const CLOUD_DEFS=[
  {xF:.08,yF:.055,rx:30,ry:10},{xF:.35,yF:.07,rx:22,ry:8},
  {xF:.55,yF:.10,rx:44,ry:13},{xF:.80,yF:.048,rx:26,ry:9},
  {xF:.66,yF:.062,rx:18,ry:7},{xF:.20,yF:.085,rx:16,ry:6}
];

function rnd(a,b){return a+Math.random()*(b-a);}

function genScene(){
  gPatch=[];
  for(let i=0;i<26;i++){
    const px=rnd(0,W),py=rnd(H*.20,H);
    if(((px-lX)/lRX)**2+((py-lY)/lRY)**2<1.35)continue;
    gPatch.push({x:px,y:py,rx:rnd(10,42),ry:rnd(7,20),rot:rnd(0,Math.PI),dk:Math.random()>.5});
  }
  reedD=[];
  [-2.55,-2.00,-1.45,-0.65,0.50,1.10,1.70,2.30,-1.20,0.90].forEach(a=>{
    reedD.push({bx:lX+lRX*1.02*Math.cos(a),by:lY+lRY*1.02*Math.sin(a),h:rnd(14,24),n:2+Math.floor(Math.random()*3),phase:rnd(0,Math.PI*2)});
  });
  lilyD=[];
  for(let i=0;i<7;i++){
    const a=rnd(0,Math.PI*2),r=rnd(.2,.72);
    lilyD.push({x:lX+lRX*r*Math.cos(a),y:lY+lRY*r*Math.sin(a),r:rnd(5,13),rot:rnd(0,Math.PI*2),open:Math.random()>.5,phase:rnd(0,Math.PI*2)});
  }
  fishD=[];
  for(let i=0;i<12;i++){
    const a=rnd(0,Math.PI*2),r=rnd(.1,.85);
    fishD.push({x:lX+lRX*r*Math.cos(a),y:lY+lRY*r*Math.sin(a),phase:rnd(0,Math.PI*2),speed:rnd(.008,.025)});
  }
  // Trees — dense wild forest around the lake
  treeData=[];
  for(let i=0;i<32;i++){
    const baseA=(i/32)*Math.PI*2+rnd(-.18,.18);
    const dist=rnd(1.15,2.8);
    const tx=lX+lRX*dist*Math.cos(baseA);
    const ty=lY+lRY*dist*Math.sin(baseA);
    if(tx<8||tx>W-8||ty<H*.10||ty>H-4)continue;
    const h=rnd(22,60)*(H/270);
    treeData.push({x:tx,y:ty,h,type:Math.random()>.42?'pine':'round',phase:rnd(0,Math.PI*2),seed:Math.random()});
  }
  treeData.sort((a,b)=>a.y-b.y);
}

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;
  cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  lX=W*.50;lY=H*.54;lRX=W*.40;lRY=H*.27;
  genScene();idle();
}
window.addEventListener('resize',resize);
setTimeout(resize,60);

function drawReeds(){
  reedD.forEach(r=>{
    for(let i=0;i<r.n;i++){
      const rx=r.bx+(i-(r.n-1)/2)*5.5;
      const sw=Math.sin(wt*.65+i*2.1+r.phase)*2.2;
      c.strokeStyle='#4a6e28';c.lineWidth=1.5;
      c.beginPath();c.moveTo(rx,r.by);
      c.quadraticCurveTo(rx+sw*.5,r.by-r.h*.55,rx+sw,r.by-r.h);
      c.stroke();
      c.fillStyle='#7a5525';c.beginPath();
      c.ellipse(rx+sw,r.by-r.h,2.2,5.5,.15,0,Math.PI*2);c.fill();
    }
  });
}

function drawLilies(){
  lilyD.forEach(l=>{
    const yNorm=(l.y-lY)/lRY; // -1 top, +1 bottom
    const perspScaleY=0.22+(1+yNorm)*0.14; // more squished at top (farther)
    const perspSize=0.55+(1+yNorm)*0.35;   // smaller at top
    const bobAmt=1.8*perspSize;
    const bobY=Math.sin(wt*0.6+l.phase)*bobAmt;
    const tilt=Math.cos(wt*0.38+l.phase*1.3)*0.05;
    const drawR=l.r*perspSize;

    c.save();
    c.translate(l.x,l.y+bobY);
    c.rotate(l.rot+tilt);
    c.scale(1,perspScaleY);

    // Drop shadow on water
    c.save();c.translate(drawR*.08,drawR*.12);
    c.fillStyle='rgba(0,0,0,0.15)';
    c.beginPath();c.ellipse(0,0,drawR,drawR*.8,0,0,Math.PI*2);c.fill();
    c.restore();

    // Pad
    c.beginPath();c.moveTo(0,0);
    c.arc(0,0,drawR,0.2,Math.PI*2-0.2);c.closePath();
    const lAlpha=0.78+yNorm*0.12;
    c.fillStyle=`rgba(32,105,38,${lAlpha})`;c.fill();
    c.strokeStyle='rgba(18,65,20,0.5)';c.lineWidth=0.7/perspScaleY;c.stroke();

    // Vein lines
    c.strokeStyle=`rgba(15,60,18,0.35)`;c.lineWidth=0.5/perspScaleY;
    for(let v=0;v<6;v++){
      const va=v/5*Math.PI*1.85+0.2;
      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(va)*drawR,Math.sin(va)*drawR);c.stroke();
    }

    // Rim highlight
    c.beginPath();c.arc(0,0,drawR,0.2,Math.PI*2-0.2);
    c.strokeStyle='rgba(80,160,70,0.25)';c.lineWidth=1.2/perspScaleY;c.stroke();

    // Flower (only for pads in bottom half — nearer)
    if(l.open&&yNorm>-0.2){
      const fa=Math.min(1,(yNorm+0.2)/0.6);
      c.globalAlpha=fa;
      c.fillStyle='rgba(255,228,195,0.92)';
      for(let p=0;p<5;p++){
        const pa=p/5*Math.PI*2;
        c.beginPath();c.ellipse(Math.cos(pa)*drawR*.22,Math.sin(pa)*drawR*.22,drawR*.19,drawR*.10,pa,0,Math.PI*2);c.fill();
      }
      c.fillStyle='rgba(255,198,45,0.97)';c.beginPath();c.arc(0,0,drawR*.12,0,Math.PI*2);c.fill();
      c.globalAlpha=1;
    }
    c.restore();
  });
}

function drawTree(t){
  const {x,y,h,type,phase,seed}=t;
  const wind=Math.sin(wt*.38+phase)*(h*.025);
  if(type==='pine'){
    // Trunk
    c.fillStyle='#5a3318';
    c.beginPath();c.rect(x-h*.04+wind*.05,y-h*.18,h*.08,h*.18);c.fill();
    // Three layered triangles, swaying
    [[.42,.38,0],[.34,.30,.22],[.26,.24,.42]].forEach(([lh,lw,yOff],li)=>{
      const sw=wind*(li+1)*.4;
      const dark=['#2a5a1e','#336624','#3e7a2a'][li];
      const ly=y-h*.15-yOff*h;
      c.fillStyle=dark;
      c.beginPath();c.moveTo(x+sw,ly-h*lh);
      c.lineTo(x-h*lw*.5+sw*.6,ly);c.lineTo(x+h*lw*.5+sw*.6,ly);
      c.closePath();c.fill();
      // Highlight edge
      c.strokeStyle='rgba(120,200,80,.15)';c.lineWidth=.7;c.stroke();
    });
  } else {
    const cr=h*.38;
    const sw=wind*.7;
    // Trunk — slightly curved
    c.strokeStyle='#6a4220';c.lineWidth=h*.09;c.lineCap='round';
    c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+sw*.3,y-h*.18,x+sw*.1,y-h*.28);c.stroke();
    c.lineCap='butt';
    // Shadow canopy
    c.fillStyle='#1e4a18';
    c.beginPath();c.ellipse(x+sw+cr*.12,y-h*.3-cr*.06,cr*.88,cr*.72,0,0,Math.PI*2);c.fill();
    // Main canopy
    c.fillStyle=seed>.5?'#3a7828':'#428a2e';
    c.beginPath();c.ellipse(x+sw,y-h*.3-cr*.18,cr*.82,cr*.72,0,0,Math.PI*2);c.fill();
    // Light patch
    c.fillStyle='rgba(110,200,60,.22)';
    c.beginPath();c.ellipse(x+sw-cr*.22,y-h*.3-cr*.42,cr*.42,cr*.32,-.3,0,Math.PI*2);c.fill();
    // Second cluster for density
    if(seed>.3){
      c.fillStyle=seed>.6?'#2e6220':'#367228';
      c.beginPath();c.ellipse(x+sw+cr*.55,y-h*.3-cr*.05,cr*.55,cr*.48,0,0,Math.PI*2);c.fill();
    }
  }
}

function drawLog(x,y,w,thick){
  // Shadow
  c.fillStyle='rgba(0,0,0,0.18)';
  c.beginPath();c.ellipse(x,y+thick*.6,w*.52,thick*.35,0,0,Math.PI*2);c.fill();
  // Log body
  const lg=c.createLinearGradient(x-w*.5,y-thick*.5,x-w*.5,y+thick*.5);
  lg.addColorStop(0,'#9a6030');lg.addColorStop(.4,'#7a4820');lg.addColorStop(1,'#4a2a10');
  c.fillStyle=lg;
  c.beginPath();c.moveTo(x-w*.5,y-thick*.5);c.lineTo(x+w*.5,y-thick*.5);
  c.lineTo(x+w*.5,y+thick*.5);c.lineTo(x-w*.5,y+thick*.5);c.closePath();c.fill();
  // End cap
  c.fillStyle='#8a5028';
  c.beginPath();c.ellipse(x+w*.5,y,thick*.28,thick*.52,0,0,Math.PI*2);c.fill();
  c.fillStyle='#6a3a18';
  c.beginPath();c.ellipse(x+w*.5,y,thick*.15,thick*.35,0,0,Math.PI*2);c.fill();
  // Bark cracks
  c.strokeStyle='rgba(40,15,5,0.35)';c.lineWidth=.8;
  [-.35,-.1,.18,.42].forEach(f=>{
    const bx=x-w*.5+w*f+w*.08;
    c.beginPath();c.moveTo(bx,y-thick*.48);
    c.quadraticCurveTo(bx+rnd(-3,3),y,bx+rnd(-2,2),y+thick*.48);c.stroke();
  });
}

function drawFox(){
  const fx=lX-lRX*.70,fy=lY+lRY*.88;
  const s=Math.min(W,H)*.038;
  // Gentle tail flick
  const tailSway=Math.sin(wt*.45)*.06;

  c.save();c.translate(fx,fy);

  const tg=c.createRadialGradient(-s*.2,s*.2,0,-s*.2,s*.2,s*1.7);
  tg.addColorStop(0,'#d84e18');tg.addColorStop(.7,'#c04010');tg.addColorStop(1,'rgba(180,55,15,0)');

  // Tail white tip

  // Belly

  c.beginPath();c.ellipse(s*.04,s*.28,s*.26,s*.38,0,0,Math.PI*2);c.fill();

  // Head — tilted slightly toward lake (looking right)
  c.save();c.translate(s*.22,-s*.52);c.rotate(.12);

  hg2.addColorStop(0,'#e05c22');hg2.addColorStop(1,'#b83c10');
  c.fillStyle=hg2;
  c.beginPath();c.ellipse(0,0,s*.40,s*.34,0,0,Math.PI*2);c.fill();
  // White face/muzzle
  c.fillStyle='#f0e0c0';
  c.beginPath();c.ellipse(s*.18,s*.08,s*.22,s*.17,.1,0,Math.PI*2);c.fill();
  // Black mask stripes
  c.fillStyle='rgba(30,12,5,0.55)';
  c.beginPath();c.ellipse(-s*.08,s*.02,s*.14,s*.08,-.3,0,Math.PI*2);c.fill();
  // Eye (looking right — curious expression)
  c.fillStyle='#0a0500';
  c.beginPath();c.ellipse(s*.25,-s*.04,s*.065,s*.065,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.ellipse(s*.27,-s*.06,s*.022,s*.022,0,0,Math.PI*2);c.fill();
  // Nose
  c.fillStyle='#120800';
  c.beginPath();c.ellipse(s*.34,s*.1,s*.055,s*.042,0,0,Math.PI*2);c.fill();
  // Left ear
  c.fillStyle='#c84015';
  c.beginPath();c.moveTo(-s*.18,-s*.24);c.lineTo(-s*.36,-s*.68);c.lineTo(-s*.02,-s*.26);c.closePath();c.fill();
  c.fillStyle='#e87050';c.globalAlpha=.7;
  c.beginPath();c.moveTo(-s*.18,-s*.26);c.lineTo(-s*.32,-s*.60);c.lineTo(-s*.05,-s*.28);c.closePath();c.fill();
  c.globalAlpha=1;
  // Right ear
  c.fillStyle='#c84015';
  c.beginPath();c.moveTo(s*.22,-s*.22);c.lineTo(s*.38,-s*.62);c.lineTo(s*.42,-s*.20);c.closePath();c.fill();
  c.fillStyle='#e87050';c.globalAlpha=.7;
  c.beginPath();c.moveTo(s*.23,-s*.24);c.lineTo(s*.36,-s*.55);c.lineTo(s*.40,-s*.23);c.closePath();c.fill();
  c.globalAlpha=1;
  c.restore();

  // Front paws resting on log
  c.fillStyle='#b83810';
  c.beginPath();c.ellipse(-s*.2,s*.62,s*.2,s*.13,-.15,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(s*.22,s*.64,s*.2,s*.13,.15,0,Math.PI*2);c.fill();
  c.fillStyle='#1a0a04';
  c.beginPath();c.ellipse(-s*.28,s*.67,s*.08,s*.055,-.2,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(s*.30,s*.68,s*.08,s*.055,.2,0,Math.PI*2);c.fill();

  c.restore();
}

function createSplash(x,y){
  // Main upward jets
  for(let i=0;i<12;i++){
    const ang=rnd(-Math.PI*.85,-Math.PI*.15);
    const spd=rnd(1.8,5.5);
    splashParticles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-rnd(.5,1.5),
      life:1,decay:rnd(.025,.055),size:rnd(1.5,4.5),gravity:.15,type:'drop'});
  }
  // Small spray ring
  for(let i=0;i<8;i++){
    const ang=rnd(0,Math.PI*2);
    splashParticles.push({x,y,vx:Math.cos(ang)*rnd(.5,2.2),vy:-rnd(.2,.8),
      life:1,decay:rnd(.04,.07),size:rnd(.8,2.2),gravity:.08,type:'spray'});
  }
}

function updateSplash(){
  splashParticles=splashParticles.filter(p=>p.life>0);
  splashParticles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;
    p.vx*=.96;p.life-=p.decay;
  });
}

function drawSplash(){
  splashParticles.forEach(p=>{
    if(p.life<=0)return;
    c.globalAlpha=p.life*.82;
    if(p.type==='drop'){
      // Teardrop shape — elongated in direction of travel
      const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      const ang=Math.atan2(p.vy,p.vx);
      c.save();c.translate(p.x,p.y);c.rotate(ang);
      c.fillStyle=`rgba(175,225,255,${p.life*.9})`;
      c.beginPath();c.ellipse(0,0,Math.min(p.size,p.size+spd*.4),p.size*.55,0,0,Math.PI*2);
      c.fill();c.restore();
    } else {
      c.fillStyle=`rgba(200,238,255,${p.life*.6})`;
      c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill();
    }
    c.globalAlpha=1;
  });
}


function drawFishGlints(){
  fishD.forEach(f=>{
    const s=Math.sin(wt*f.speed*60+f.phase);
    if(s<0.7)return;
    const alpha=(s-0.7)/0.3*0.22;
    c.fillStyle=`rgba(200,240,255,${alpha})`;
    c.beginPath();c.ellipse(f.x,f.y,3,1.4,rnd(-0.3,0.3),0,Math.PI*2);c.fill();
  });
}

function drawScene(rips=[]){
  c.clearRect(0,0,W,H);
  const hY=H*.21;
  const skyG=c.createLinearGradient(0,0,0,hY);
  skyG.addColorStop(0,'#4a90c0');skyG.addColorStop(.6,'#7ab8d8');skyG.addColorStop(1,'#aad4e8');
  c.fillStyle=skyG;c.fillRect(0,0,W,hY);
  const hgG=c.createLinearGradient(0,hY*.55,0,hY);
  hgG.addColorStop(0,'rgba(255,220,160,0)');hgG.addColorStop(1,'rgba(255,220,160,0.18)');
  c.fillStyle=hgG;c.fillRect(0,hY*.55,W,hY*.45);
  // Wind-driven clouds
  cloudWind+=.00018;
  c.globalAlpha=.32;
  CLOUD_DEFS.forEach(cl=>{
    const cx=((cl.xF+cloudWind)%1.25-.12)*W, cy=cl.yF*H;
    c.fillStyle='#fff';
    [[0,0,1,1],[-.4,.14,.62,.80],[.44,.14,.55,.76],[0,.35,.4,.6]].forEach(([dx,dy,fx,fy])=>{
      c.beginPath();c.ellipse(cx+dx*cl.rx,cy+dy*cl.ry,cl.rx*fx,cl.ry*fy,0,0,Math.PI*2);c.fill();
    });
  });
  c.globalAlpha=1;
  c.fillStyle='#3e7832';
  c.beginPath();c.moveTo(0,hY*.80);
  for(let x=0;x<=W;x+=W/12)c.lineTo(x,hY*.78-Math.sin(x/W*Math.PI*3.2+1.0)*hY*.32);
  c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
  c.fillStyle='#4e9040';
  c.beginPath();c.moveTo(0,hY*.92);
  for(let x=0;x<=W;x+=W/10)c.lineTo(x,hY*.90-Math.sin(x/W*Math.PI*2.6+.4)*hY*.38);
  c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
  const gg=c.createLinearGradient(0,hY,0,H);
  gg.addColorStop(0,'#4e9040');gg.addColorStop(.18,'#3e7c32');gg.addColorStop(.6,'#336628');gg.addColorStop(1,'#2a5520');
  c.fillStyle=gg;c.fillRect(0,hY,W,H-hY);
  c.globalAlpha=.07;
  gPatch.forEach(p=>{c.fillStyle=p.dk?'#193e14':'#68b85a';c.beginPath();c.ellipse(p.x,p.y,p.rx,p.ry,p.rot,0,Math.PI*2);c.fill();});
  c.globalAlpha=1;
  // Trees behind lake (upper half of scene)
  treeData.filter(t=>t.y<lY).forEach(t=>drawTree(t));
  for(let a=0;a<Math.PI*2;a+=0.22){
    const edX=lX+(lRX+2)*Math.cos(a),edY=lY+(lRY+2)*Math.sin(a);
    const sw2=Math.sin(wt*.5+a*3)*1.5;
    const bh=rnd(5,11);
    c.strokeStyle=`hsl(${110+Math.sin(a*7)*12},50%,${28+Math.sin(a*5)*6}%)`;
    c.lineWidth=1.2;
    c.beginPath();c.moveTo(edX,edY);
    c.quadraticCurveTo(edX+sw2,edY-bh*.55,edX+sw2*1.4,edY-bh);c.stroke();
  }
  c.globalAlpha=1;
  const bkG=c.createRadialGradient(lX,lY,Math.min(lRX,lRY)*.62,lX,lY,Math.max(lRX,lRY)+28);
  bkG.addColorStop(0,'rgba(0,0,0,0)');bkG.addColorStop(.72,'rgba(0,0,0,0)');
  bkG.addColorStop(.86,'rgba(80,140,60,.28)');bkG.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=bkG;c.beginPath();c.ellipse(lX,lY,lRX+28,lRY+18,0,0,Math.PI*2);c.fill();
  c.save();c.beginPath();c.ellipse(lX,lY,lRX+6,lRY+4,0,0,Math.PI*2);c.clip();
  c.strokeStyle='rgba(90,70,40,0.18)';c.lineWidth=8;
  c.beginPath();c.ellipse(lX,lY,lRX+2,lRY+1,0,0,Math.PI*2);c.stroke();c.restore();
  // LAKE
  c.save();c.beginPath();c.ellipse(lX,lY,lRX,lRY,0,0,Math.PI*2);c.clip();
  const lkG=c.createRadialGradient(lX-lRX*.15,lY-lRY*.15,lRX*.1,lX,lY,lRX*1.1);
  lkG.addColorStop(0,'#3d92bc');lkG.addColorStop(.3,'#2d78a0');lkG.addColorStop(.65,'#1e5878');lkG.addColorStop(1,'#0e2e48');
  c.fillStyle=lkG;c.fillRect(lX-lRX,lY-lRY,lRX*2,lRY*2);
  c.globalAlpha=.12;
  [{x:lX-lRX*.3,y:lY+lRY*.35,rx:lRX*.25,ry:lRY*.15},{x:lX+lRX*.25,y:lY+lRY*.40,rx:lRX*.20,ry:lRY*.12}].forEach(b=>{
    c.fillStyle='#1a4a20';c.beginPath();c.ellipse(b.x,b.y,b.rx,b.ry,0,0,Math.PI*2);c.fill();
  });
  c.globalAlpha=1;
  const rfG=c.createLinearGradient(0,lY-lRY,0,lY-lRY*.15);
  rfG.addColorStop(0,'rgba(165,215,240,.28)');rfG.addColorStop(1,'rgba(165,215,240,0)');
  c.fillStyle=rfG;c.fillRect(lX-lRX,lY-lRY,lRX*2,lRY*.85);
  c.globalAlpha=.06;
  for(let i=0;i<6;i++){
    const cx2=lX+Math.sin(wt*.3+i*1.1)*lRX*.4,cy2=lY+Math.cos(wt*.2+i*.8)*lRY*.3;
    const cg=c.createRadialGradient(cx2,cy2,0,cx2,cy2,lRX*.28);
    cg.addColorStop(0,'rgba(120,220,255,1)');cg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=cg;c.fillRect(lX-lRX,lY-lRY,lRX*2,lRY*2);
  }
  c.globalAlpha=1;
  for(let row=0;row<8;row++){
    const wy=lY-lRY*.74+(lRY*1.48)*(row/7);
    const mxH=lRX*Math.sqrt(Math.max(0,1-((wy-lY)/lRY)**2));
    if(mxH<5)continue;
    c.strokeStyle=`rgba(180,235,255,${.04+row*.014})`;c.lineWidth=.8;
    c.beginPath();let first=true;
    for(let wx=lX-mxH+4;wx<=lX+mxH-4;wx+=3){
      const wv=Math.sin(wx/W*Math.PI*10+wt*1.1+row*.65)*1.8+Math.sin(wx/W*Math.PI*6+wt*.7+row)*0.8;
      if(first){c.moveTo(wx,wy+wv);first=false;}else c.lineTo(wx,wy+wv);
    }c.stroke();
  }
  c.globalAlpha=.16;c.fillStyle='rgba(240,250,255,1)';
  c.beginPath();c.ellipse(lX-lRX*.18,lY-lRY*.30,lRX*.24,lRY*.10,-.22,0,Math.PI*2);c.fill();
  c.globalAlpha=.10;
  c.beginPath();c.ellipse(lX+lRX*.20,lY-lRY*.18,lRX*.10,lRY*.05,.15,0,Math.PI*2);c.fill();
  c.globalAlpha=1;
  drawFishGlints();
  // Ripples
  rips.forEach(r=>{
    if(r.a<=0)return;
    const scY=.28+.18*((r.y-lY+lRY)/(lRY*2));
    c.strokeStyle=`rgba(200,238,255,${r.a*.60})`;c.lineWidth=1;
    c.beginPath();c.ellipse(r.x,r.y,r.r,r.r*scY,0,0,Math.PI*2);c.stroke();
    if(r.r>8){c.beginPath();c.ellipse(r.x,r.y,r.r*.48,r.r*scY*.48,0,0,Math.PI*2);c.stroke();}
  });
  drawLilies();
  c.restore();
  c.strokeStyle='rgba(110,195,225,.22)';c.lineWidth=1.8;
  c.beginPath();c.ellipse(lX,lY,lRX,lRY,0,0,Math.PI*2);c.stroke();
  drawReeds();
  // Trees in front of lake (lower half) — depth over lake
  treeData.filter(t=>t.y>=lY).forEach(t=>drawTree(t));
  // Fox on log
  drawFox();
  // Splash droplets on top of everything
  drawSplash();
}

/* ── STONE ─────────────────────────────────────────────────────── */
function drawStone(x,y,sz,ang,alpha=1){
  if(sz<0.5||alpha<=0)return;
  c.save();c.globalAlpha=alpha;c.translate(x,y);c.rotate(ang);
  const sw=sz,sh=sz*.46; // flatter = more like a skipping stone

  // Ground shadow
  c.save();c.translate(sw*.12,sh*.58);c.scale(1,.22);
  const shg=c.createRadialGradient(0,0,0,0,0,sw*1.05);
  shg.addColorStop(0,'rgba(0,0,0,.55)');shg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=shg;c.beginPath();c.ellipse(0,0,sw*1.1,sw*1.1,0,0,Math.PI*2);c.fill();
  c.restore();

  // Build stone as irregular polygon — hard angular silhouette
  const pts=[];
  const nPts=9;
  // Deterministic offsets so shape stays consistent across frames
  const offsets=[.08,-.11,.07,-.09,.12,-.06,.10,-.13,.05];
  for(let i=0;i<nPts;i++){
    const a=(i/nPts)*Math.PI*2;
    const r=1+offsets[i]*.55;
    pts.push([Math.cos(a)*sw*r, Math.sin(a)*sh*r]);
  }
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<nPts;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.closePath();

  // Base gradient — dark slate with cool undertone, high contrast
  const bg=c.createLinearGradient(-sw*.3,-sh*.5,sw*.4,sh*.6);
  bg.addColorStop(0,'#7a8c94');
  bg.addColorStop(.18,'#5e6e75');
  bg.addColorStop(.45,'#3d4e54');
  bg.addColorStop(.72,'#28373c');
  bg.addColorStop(1,'#182228');
  c.fillStyle=bg;c.fill();

  // Hard edge strokes on facet lines — gives angular geology feel
  c.globalAlpha=alpha*.55;
  c.strokeStyle='#1a2a30';c.lineWidth=.7;c.stroke();

  // Mineral veins / crack lines — sharp, not soft
  c.globalAlpha=alpha*.22;
  c.strokeStyle='#8aabb5';c.lineWidth=.6;
  // 2 hard crack lines across the surface
  c.beginPath();c.moveTo(-sw*.38,-sh*.08);c.lineTo(sw*.18,sh*.22);c.stroke();
  c.beginPath();c.moveTo(-sw*.10,-sh*.32);c.lineTo(sw*.30,sh*.05);c.stroke();

  // Dark grain dots — sharp specks, not soft blobs
  c.globalAlpha=alpha*.30;
  const grainPts=[[-sw*.28,-sh*.12],[sw*.15,-sh*.20],[-sw*.05,sh*.18],
                  [sw*.32,sh*.08],[-sw*.20,sh*.25],[sw*.05,-sh*.28],
                  [-sw*.38,sh*.05],[sw*.22,sh*.24]];
  grainPts.forEach(([gx,gy])=>{
    const ink=Math.hypot(gx/sw,gy/sh);
    if(ink>.82)return;
    c.fillStyle='#0e1a1e';
    c.beginPath();c.rect(gx-.5,gy-.5,1.1,1.1);c.fill(); // square, not round
  });

  // Rim — sharp defined edge
  c.globalAlpha=alpha;
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<nPts;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.closePath();
  c.strokeStyle='rgba(90,115,122,.65)';c.lineWidth=.9;c.stroke();

  // Specular highlight — hard sharp spot, not soft glow
  // Primary glint: small, bright, crisp
  const hg=c.createRadialGradient(-sw*.26,-sh*.28,0,-sw*.26,-sh*.28,sw*.28);
  hg.addColorStop(0,'rgba(235,248,252,.82)');
  hg.addColorStop(.35,'rgba(180,210,220,.30)');
  hg.addColorStop(.7,'rgba(140,175,185,.06)');
  hg.addColorStop(1,'rgba(0,0,0,0)');
  c.beginPath();c.ellipse(-sw*.26,-sh*.28,sw*.22,sh*.16,-.25,0,Math.PI*2);
  c.fillStyle=hg;c.fill();

  // Tiny hard specular dot — the "glass-hard" point
  c.globalAlpha=alpha*.90;
  c.fillStyle='rgba(255,255,255,.88)';
  c.beginPath();c.ellipse(-sw*.30,-sh*.32,sw*.055,sh*.042,-.2,0,Math.PI*2);c.fill();

  c.restore();
}


function idle(){
  cancelAnimationFrame(iid);
  function lp(){
    wt+=.018;
    activeRips.forEach(r=>{r.r+=2.5;r.a-=.018;});
    activeRips=activeRips.filter(r=>r.a>0);
    updateSplash();
    drawScene(activeRips);
    iid=requestAnimationFrame(lp);
  }
  lp();
}

/* ── POSITION ──────────────────────────────────────────────────── */
function sPos(ai,t,bounces){
  const maxB=MODES[mod].p.length-1;
  const sinkArc=bounces+1;        // sink is ALWAYS the last arc
  const numA=sinkArc;              // number of advancing arcs (throw + bounce arcs)
  const xS=lX-lRX*.72;
  const xSpan=lRX*1.44*Math.min(1,(bounces+.75)/(maxB+.75));
  const aW=xSpan/numA;
  const isSink=(ai===sinkArc);
  const x=xS+aW*ai+(isSink?0:aW*t); // freeze x only on sink arc
  const xP=(x-lX+lRX*.72)/(lRX*1.44);
  const sY=lY+lRY*.05-xP*lRY*.12;
  const aH=lRY*1.08*Math.pow(.66,ai)*Math.max(xP,.12);
  let y;
  if(isSink){
    y=sY+t*lRY*0.92; // straight down, no arc
  } else {
    y=sY-aH*Math.sin(Math.PI*t); // normal bell arc (throw or bounce)
  }
  return{x,y,sY,sz:11-xP*3,ang:(t-.5)*.62,isSink};
}

/* ── ANIMATION ─────────────────────────────────────────────────── */
function animate(bounces,done){
  cancelAnimationFrame(iid);
  // Do NOT reset activeRips — let existing ripples/splashes finish
  let ai=0,t=0,trail=[],sunkFired=false,finishing=false;
  document.getElementById('ro').classList.remove('show');

  function step(){
    wt+=.018;
    activeRips.forEach(r=>{r.r+=2.5;r.a-=.018;});
    activeRips=activeRips.filter(r=>r.a>0);
    updateSplash();

    // Once stone is gone, hand off to idle and fire done callback
    if(finishing) return;

    const pos=sPos(ai,t,bounces);
    drawScene(activeRips);

    // Trail (skip in fast mode; clear on sink arc)
    if(!fast && !pos.isSink){
      trail.push({...pos,a:1});if(trail.length>9)trail.shift();
      trail.forEach(p=>p.a*=.74);
      trail.forEach(p=>{c.globalAlpha=p.a*.20;drawStone(p.x,p.y,p.sz*.65,p.ang);});
      c.globalAlpha=1;
    } else if(pos.isSink){
      trail=[];
    }

    // Stone: fade+clip when below water surface, draw normally above
    if(pos.isSink && pos.y > pos.sY){
      const depth=(pos.y-pos.sY)/(pos.sz*1.5);
      const fade=Math.max(0,1-depth*1.8);
      if(fade>0){
        c.save();
        c.beginPath();c.rect(0,0,W,pos.sY+2);c.clip();
        drawStone(pos.x,pos.y,pos.sz,pos.ang,fade);
        c.restore();
      } else {
        // Fully submerged — hand off
        finishing=true;
        idle();
        setTimeout(done,500);
        return;
      }
    } else {
      drawStone(pos.x,pos.y,pos.sz,pos.ang);
    }

    // Splash+sound: epsilon avoids false trigger at t=0 start of post-bounce sink arc
    if(pos.isSink && pos.y > pos.sY+0.8 && !sunkFired){
      sunkFired=true;
      playPlouf();
      createSplash(pos.x,pos.sY);
      activeRips.push({x:pos.x,y:pos.sY,r:14,a:1});
      activeRips.push({x:pos.x-7,y:pos.sY+2,r:8,a:.75});
      activeRips.push({x:pos.x+6,y:pos.sY-1,r:7,a:.65});
    }

    const spd=fast?.06:.016;
    t+=spd;

    if(t>=1){
      // End of one arc segment
      if(ai<bounces){
        // This was a bounce arc — play sound and add ripple
        bounceSound(ai);
        const ripR=Math.max(3,7-ai*1.2);
        const ripA=Math.max(0.4,1-ai*0.12);
        const bp=sPos(ai,1,bounces);
        activeRips.push({x:bp.x,y:bp.sY,r:ripR,a:ripA});
      }
      ai++;t=0;trail=[];
      // sinkArc = bounces+1, so we're done when ai exceeds it
      if(ai>bounces+1){
        finishing=true;
        idle();
        setTimeout(done,500);
        return;
      }
    }

    requestAnimationFrame(step);
  }
  step();
}

/* ── GAME ──────────────────────────────────────────────────────── */
function roll(){const mo=MODES[mod],r=Math.random();let cum=0;for(let i=0;i<mo.p.length;i++){cum+=mo.p[i];if(r<cum)return i;}return mo.p.length-1;}
function getBet(){return Math.max(1,Math.round((parseFloat(document.getElementById('bi').value)||1)*100)/100);}
function adj(f){document.getElementById('bi').value=Math.max(1,Math.round(getBet()*f*100)/100);}
function allIn(){document.getElementById('bi').value=Math.floor(bal);}
function setUI(on){document.getElementById('lb').disabled=!on;document.getElementById('bi').disabled=!on;}
function upd(){
  document.getElementById('bal').textContent=Math.round(bal).toLocaleString('fr-FR');
  document.getElementById('sg').textContent=st.games;
  document.getElementById('sw').textContent=st.wins;
}
function addHist(mult,win){
  hist.unshift({mult,win});if(hist.length>16)hist.pop();
  document.getElementById('hl').innerHTML=hist.map(h=>`<span class="hp ${h.win?'w':'l'}">${h.win?'x'+h.mult.toFixed(2):'x0'}</span>`).join('');
}
function toggleFast(){fast=!fast;const fb=document.getElementById('fb');fb.classList.toggle('on',fast);fb.textContent=fast?'Rapide ON':'Pari rapide';}
function toggleSnd(){sndOn=!sndOn;document.getElementById('sndBtn').textContent=sndOn?'Son ON':'Son OFF';}

function launch(){
  if(busy)return;
  const bet=getBet();
  if(bet>bal){document.getElementById('bi').value=Math.floor(bal);return;}
  busy=true;setUI(false);ensureAC();
  const mo=MODES[mod],b=roll(),mult=mo.m[b],pay=bet*mult,win=mult>0;
  bal-=bet;upd();
  animate(b,()=>{
    // Set result display AFTER animation ends
    const rm=document.getElementById('rm'),rs=document.getElementById('rs'),ro=document.getElementById('ro');
    rm.textContent=win?'x'+mult.toFixed(2):'x0';
    rm.className='rmult '+(win?'w':'l');
    rs.textContent=win?'+'+(pay-bet).toFixed(2)+' €':'−'+bet.toFixed(2)+' €';
    rs.className='rsub '+(win?'w':'l');
    ro.classList.add('show');
    if(win){bal+=pay;winSound(mult);}
    st.games++;if(win)st.wins++;
    addHist(mult,win);upd();
    busy=false;setUI(true);idle();
  });
}

function buildDiff(){
  const g=document.getElementById('dg');
  g.innerHTML='';
  const tt=document.getElementById('tt');
  MODES.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='dbtn'+(i===mod?' act':'');
    d.innerHTML=`<span class="dname">${m.n}</span><span class="dinfo">${m.mx}</span>`;
    d.onclick=()=>{mod=i;buildDiff();};
    const winPct=Math.round((1-m.p[0])*100);
    d.onmouseenter=()=>{tt.textContent=`Chance de gain : ${winPct}%`;tt.classList.add('show');};
    d.onmousemove=(e)=>{tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-38)+'px';};
    d.onmouseleave=()=>tt.classList.remove('show');
    g.appendChild(d);
  });
}
buildDiff();
// ── SHARED BALANCE ──
const NC_KEY='nc_portfolio_balance';
(function initBal(){
  const v=parseFloat(localStorage.getItem(NC_KEY));
  if(!isNaN(v)&&v>0){bal=Math.round(v*100)/100;}
  upd();
})();
function saveBal(){localStorage.setItem(NC_KEY,bal);sessionStorage.setItem('nc_came_from_game','1');}
function saveAndBack(e){e.preventDefault();saveBal();window.location.href='index.html';}
window.addEventListener('beforeunload',saveBal);
</script>
