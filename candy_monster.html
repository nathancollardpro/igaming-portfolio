<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1622;--bg2:#172533;--bg3:#1e3245;--bg4:#243b52;
  --grn:#00e701;--gdn:#00b800;--gbg:rgba(0,231,1,.10);

  --amb:#f5a623;--abg:rgba(245,166,35,.12);
  --pur:#9b59b6;--pubg:rgba(155,89,182,.12)
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.logo{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--grn);margin-bottom:2rem;opacity:.55}
.shell{width:100%;max-width:680px;background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;border-bottom:1px solid var(--bdr);background:var(--bg)}
.balgrp{display:flex;align-items:center;gap:10px}
.ballbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.balval{font-size:15px;font-weight:700;color:#fff}
.balval span{color:var(--grn)}
.snd{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--dim);cursor:pointer;font-family:'Inter',sans-serif}
.cvarea{position:relative;height:300px;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
.ctrls{padding:1.2rem 1.25rem;display:flex;flex-direction:column;gap:.9rem}
.clbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:relative}
.dbtn{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .12s}
.dbtn:hover{border-color:rgba(0,231,1,.25);background:var(--bg3)}
.dbtn.act{border-color:var(--mode-c);background:var(--mode-bg)}
.dbtn.act .dname{color:var(--mode-c)}
.dbtn.act .dinfo{color:rgba(255,255,255,.45)}
.dname{font-size:11px;font-weight:700;color:#fff;display:block}
.dinfo{font-size:10px;color:var(--dim);display:block;margin-top:2px}
.crow{display:flex;gap:.75rem;align-items:flex-start}
.cblk{flex:1}
.bwrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:0 10px;height:40px;gap:6px;transition:border-color .15s}
.bwrap:focus-within{border-color:rgba(0,231,1,.35)}
.cur{font-size:12px;color:var(--dim)}
input[type=number]{background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;width:100%}
input[type=number]::-webkit-inner-spin-button{display:none}
.bbtns{display:flex;gap:4px;margin-top:5px}
.bbtn{flex:1;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--dim);font-size:11px;font-family:'Inter',sans-serif;padding:4px 0;cursor:pointer;transition:all .12s}
.bbtn:hover{background:var(--bg4);color:var(--txt)}
.lrow{display:flex;gap:8px}
.lbtn{flex:1;height:52px;background:var(--grn);color:#000;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;border:none;border-radius:8px;cursor:pointer;letter-spacing:.03em;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:7px}
.lbtn:hover:not(:disabled){background:var(--gdn)}
.lbtn:active:not(:disabled){transform:scale(.985)}
.lbtn:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}
.cobtn{height:52px;background:transparent;border:2px solid var(--amb);color:var(--amb);font-size:13px;font-weight:700;font-family:'Inter',sans-serif;border-radius:8px;cursor:pointer;padding:0 20px;transition:all .12s;white-space:nowrap}
.cobtn:hover:not(:disabled){background:var(--abg)}
.cobtn:disabled{opacity:.3;cursor:not-allowed}
.srow{display:flex;gap:6px;padding:0 1.25rem 1rem}
.stat{flex:1;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:.55rem .75rem;text-align:center}
.slbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.sval{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.sval.g{color:var(--grn)}.sval.r{color:var(--red)}
.hist{padding:0 1.25rem 1.2rem}
.hlbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.hlist{display:flex;gap:5px;flex-wrap:wrap}
.hp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.hp.w{background:var(--gbg);color:var(--grn)}
.hp.l{background:var(--rbg);color:var(--red)}
.tt{position:fixed;background:rgba(0,10,20,0.92);color:#c2d4e0;font-size:11px;font-family:'Inter',sans-serif;padding:6px 11px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:normal;line-height:1.6;z-index:999;border:1px solid rgba(255,255,255,.1);max-width:200px}
.tt.show{opacity:1}
</style>
</head>

<script>
/* ── CONFIG ────────────────────────────────────────────────── */
const MODES={
  facile:{label:'😄 Facile',color:'#00e701',bg:'rgba(0,231,1,.10)',
    mults:[1.03,1.09,1.15,1.23,1.31,1.40,1.51,1.63,1.78,1.96,2.18,2.45,2.80,3.27,3.92,4.90,6.53,9.80,19.60],
    busts:[0.05,0.052632,0.055556,0.058824,0.0625,0.066667,0.071429,0.076923,0.083333,0.090909,0.1,0.111111,0.125,0.142857,0.166667,0.2,0.25,0.333333,0.5],
    cumWin:[95,90,85,80,75,70,65,60,55,50,45,40,35,30,25,20,15,10,5],

    mults:[1.15,1.37,1.64,2.00,2.46,3.07,3.91,5.08,6.77,9.31,13.30,19.95,31.92,55.86,111.72,279.30,1117.20],
    busts:[0.15,0.157895,0.166667,0.176471,0.1875,0.2,0.214286,0.230769,0.25,0.272727,0.3,0.333333,0.375,0.428571,0.5,0.6,0.750001],
    cumWin:[85,71.6,59.6,49.1,39.9,31.9,25.1,19.3,14.5,10.5,7.4,4.9,3.1,1.8,0.9,0.4,0.1],

  difficile:{label:'🫨 Difficile',color:'#e74c3c',bg:'rgba(231,76,60,.10)',
    mults:[1.31,1.77,2.46,3.48,5.06,7.59,11.81,19.18,32.89,60.29,120.59,271.32,723.52,2532.32,15193.92],
    busts:[0.25,0.263158,0.277778,0.294118,0.3125,0.333333,0.357143,0.384615,0.416667,0.454545,0.5,0.555555,0.625,0.714284,0.833333],
    cumWin:[75,55.3,39.9,28.2,19.4,12.9,8.3,5.1,3.0,1.6,0.8,0.4,0.1,0.04,0.006],
    candy:'#f44336',candyLight:'#ef9a9a',info:'Max ×15 193'},
  extreme:{label:'😈 Expert',color:'#9b59b6',bg:'rgba(155,89,182,.12)',
    mults:[1.96,4.14,9.31,22.61,60.29,180.88,633.08,2743.35,16460.08,181060.88],
    busts:[0.5,0.526316,0.555556,0.588235,0.625,0.666666,0.714285,0.76923,0.833329,0.909137],
    cumWin:[50,23.7,10.5,4.3,1.6,0.5,0.15,0.036,0.006,0.0005],
    candy:'#9c27b0',candyLight:'#ce93d8',info:'Max ×181 060'}
};

/* ── STATE ─────────────────────────────────────────────────── */
let bal=1000,mod='facile',sndOn=true,busy=false;
let phase='idle'; // idle|active|busted|cashedout
let step=0,currentMult=1.0,currentBet=10;
let st={games:0,wins:0,maxMise:0},hist=[];
let AC=null;

/* ── AUDIO ─────────────────────────────────────────────────── */
function ensureAC(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}
  if(AC.state==='suspended')AC.resume();
}
function playNom(){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  // Crunchy crunch — layered noise burst + pitch drop
  const sr=AC.sampleRate,bl=Math.floor(sr*.18),buf=AC.createBuffer(1,bl,sr),d=buf.getChannelData(0);
  for(let i=0;i<bl;i++){
    const env=Math.exp(-i/bl*12)*(1+Math.sin(i/bl*38));
    d[i]=(Math.random()*2-1)*env;
  }
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=0.8;
  const f2=AC.createBiquadFilter();f2.type='peaking';f2.frequency.value=400;f2.gain.value=8;
  const g=AC.createGain();g.gain.setValueAtTime(0.65,t);g.gain.exponentialRampToValueAtTime(0.001,t+.22);
  src.connect(f);f.connect(f2);f2.connect(g);g.connect(AC.destination);src.start(t);src.stop(t+.22);
  // Soft thud underneath
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.08);
  og.gain.setValueAtTime(.18,t);og.gain.exponentialRampToValueAtTime(.001,t+.10);
  o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.12);
}
function playRefuse(){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(150,t+.3);
  g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+.35);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.4);
}
function playVomit(){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(450,t);o.frequency.exponentialRampToValueAtTime(60,t+.7);
  g.gain.setValueAtTime(0.30,t);g.gain.linearRampToValueAtTime(0.35,t+.1);g.gain.exponentialRampToValueAtTime(0.001,t+.75);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.8);
  // gurgle noise
  const sr=AC.sampleRate,bl=Math.floor(sr*.5),buf=AC.createBuffer(1,bl,sr),d=buf.getChannelData(0);
  for(let i=0;i<bl;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/bl*3);
  const ns=AC.createBufferSource();ns.buffer=buf;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=400;
  const ng=AC.createGain();ng.gain.setValueAtTime(0.2,t);ng.gain.exponentialRampToValueAtTime(0.001,t+.55);
  ns.connect(fl);fl.connect(ng);ng.connect(AC.destination);ns.start(t);ns.stop(t+.6);
}
function playWin(mult){
  if(!sndOn||!AC)return;
  const t=AC.currentTime;
  const big=mult>=5;
  const freqs=big?[523,659,784,1047,1319]:[523,659,784,1047];
  freqs.forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=i<2?'sine':'triangle';o.frequency.value=f;
    const st2=t+i*.07;
    g.gain.setValueAtTime(0,st2);g.gain.linearRampToValueAtTime(big?.28:.22,st2+.03);
    g.gain.exponentialRampToValueAtTime(0.001,st2+.5+i*.03);
    o.connect(g);g.connect(AC.destination);o.start(st2);o.stop(st2+.55);
  });
  if(big){
    const bo=AC.createOscillator(),bg=AC.createGain();
    bo.type='sine';bo.frequency.setValueAtTime(110,t);bo.frequency.exponentialRampToValueAtTime(55,t+.3);
    bg.gain.setValueAtTime(.32,t);bg.gain.exponentialRampToValueAtTime(.001,t+.35);
    bo.connect(bg);bg.connect(AC.destination);bo.start(t);bo.stop(t+.4);
  }
}

/* ── CANVAS ────────────────────────────────────────────────── */
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
let W,H,wt=0,iid;

// Animation state
let monState='idle'; // idle|eating|happy|warning|refuse|vomit|win
let monT=0,blinkT=-999,nextBlink=220;
let shakeT=0,shakeAmt=0;
let candyFly=null;   // {x,y,tx,ty,t,maxT,rot,bouncing,dead}
let vomParts=[];     // vomit particles
let confParts=[];    // confetti
let lookTX=0,lookTY=0,lookX=0,lookY=0,nextLook=0; // idle look direction
let bounceOffset=0; // idle bounce
let multPulse=0;

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;
  cv.style.width=r.width+'px';cv.style.height=r.height+'px';
}
window.addEventListener('resize',()=>{resize();drawAll();});
setTimeout(()=>{resize();idle();},60);

/* ── HELPERS ───────────────────────────────────────────────── */
function rnd(a,b){return a+Math.random()*(b-a);}
function lerp(a,b,t){return a+(b-a)*t;}
function adjustHex(hex,amt){
  const r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const cl=v=>Math.max(0,Math.min(255,v));
  return `#${cl(r+amt).toString(16).padStart(2,'0')}${cl(g2+amt).toString(16).padStart(2,'0')}${cl(b+amt).toString(16).padStart(2,'0')}`;
}

/* ── DRAW MONSTER ──────────────────────────────────────────── */
function drawMonster(){
  const mx=W*.50, my=H*.56;
  const R=Math.min(W*.16, H*.185);
  // Use bounceOffset for idle, existing bob for active
  const idleBounce=(monState==='idle'||monState==='happy')?bounceOffset:0;
  const bob=Math.sin(wt*.038)*R*.05+idleBounce*(R/H*18);
  const sx=shakeAmt>0?Math.sin(wt*.8)*shakeAmt*R*.06:0;

  ctx.save();
  ctx.translate(mx+sx, my+bob);

  // belly scale grows with step
  const bScale=1+Math.min(step,8)*.022;
  ctx.scale(bScale,bScale);

  // Shadow
  ctx.save();ctx.translate(R*.06,R*.92);ctx.scale(1,.18);
  const sg=ctx.createRadialGradient(0,0,0,0,0,R*1.0);
  sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Body color: greener by default, slightly more red/yellow when full
  const fullness=Math.min(step/8,1);
  const gr=Math.round(76+fullness*30),gg=Math.round(175-fullness*40),gb=Math.round(80-fullness*30);

  // Body gradient
  const bodyG=ctx.createRadialGradient(-R*.30,-R*.32,R*.04,R*.06,R*.06,R*1.12);
  bodyG.addColorStop(0,`rgb(${gr+55},${gg+55},${gb+20})`);
  bodyG.addColorStop(.45,`rgb(${gr},${gg},${gb})`);
  bodyG.addColorStop(1,`rgb(${Math.max(gr-45,0)},${Math.max(gg-50,0)},${Math.max(gb-30,0)})`);

  if(monState==='vomit'){
    // Pale face
    ctx.fillStyle='rgba(200,240,180,0.85)';
    ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=bodyG;
  if(monState!=='vomit'){ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();}

  // Belly highlight
  ctx.fillStyle=`rgba(255,255,220,${0.08+fullness*.10})`;
  ctx.beginPath();ctx.ellipse(R*.06,R*.30,R*.52,R*.40,0,0,Math.PI*2);ctx.fill();

  // Top nubs (Om Nom style)
  const nubG=ctx.createRadialGradient(0,-R*.85,0,0,-R*.85,R*.18);
  nubG.addColorStop(0,`rgb(${gr+40},${gg+40},${gb+15})`);
  nubG.addColorStop(1,`rgb(${gr-10},${gg-15},${gb-8})`);
  ctx.fillStyle=nubG;
  [[-R*.24,-R*.87],[R*.24,-R*.87]].forEach(([nx,ny])=>{
    ctx.beginPath();ctx.arc(nx,ny,R*.155,0,Math.PI*2);ctx.fill();
  });

  // Eyes
  const eyeY=-R*.18;
  const eyeSpacing=R*.30;
  const isBlink=(wt-blinkT)<7;
  const isWarning=monState==='warning'||step>=4;
  const isRefuse=monState==='refuse';

  [-eyeSpacing,eyeSpacing].forEach((ex,ei)=>{
    const isLeft=ei===0;
    const eyeR=R*.255;

    // Brow (warning/vomit)
    if(isWarning||monState==='vomit'){
      ctx.strokeStyle='rgba(20,60,10,.7)';ctx.lineWidth=R*.048;ctx.lineCap='round';
      ctx.beginPath();
      if(isLeft){ctx.moveTo(ex-eyeR*.65,eyeY-eyeR*.80);ctx.lineTo(ex+eyeR*.45,eyeY-eyeR*.58);}
      else{ctx.moveTo(ex-eyeR*.45,eyeY-eyeR*.58);ctx.lineTo(ex+eyeR*.65,eyeY-eyeR*.80);}
      ctx.stroke();
    }

    // Eye white
    ctx.fillStyle='#fff';
    const eyeScaleY=isBlink?.12:1;
    ctx.save();ctx.translate(ex,eyeY);ctx.scale(1,eyeScaleY);
    ctx.beginPath();ctx.ellipse(0,0,eyeR*.90,eyeR,0,0,Math.PI*2);ctx.fill();
    ctx.restore();

    if(!isBlink){
      // Pupil direction
      let px=isLeft?-eyeR*.22:eyeR*.22, py=0;
      if(monState==='idle'){
        // Look around smoothly
        px=lookX*eyeR*(isLeft?.55:.55);
        py=lookY*eyeR*.55;
      }
      if(monState==='eating'){px=isLeft?ex*.08:ex*.08;py=eyeR*.35;}
      if(isRefuse){px=isLeft?-eyeR*.55:-eyeR*.35;}
      if(monState==='vomit'){px=(Math.sin(wt*.5)*eyeR*.3)|0;py=eyeR*.2;}

      ctx.fillStyle='#0d1610';
      ctx.beginPath();ctx.ellipse(ex+px,eyeY+py,eyeR*.55,eyeR*.58,0,0,Math.PI*2);ctx.fill();
      // Shine
      ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.beginPath();ctx.arc(ex+px-eyeR*.17,eyeY+py-eyeR*.20,eyeR*.145,0,Math.PI*2);ctx.fill();
      // Second tiny shine
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath();ctx.arc(ex+px+eyeR*.12,eyeY+py+eyeR*.15,eyeR*.06,0,Math.PI*2);ctx.fill();
    }

    // Rosy cheeks
    if(monState==='happy'||monState==='eating'){
      ctx.fillStyle='rgba(255,110,110,.28)';
      ctx.beginPath();ctx.ellipse(ex+(isLeft?-eyeR*.25:eyeR*.25),eyeY+eyeR*.80,eyeR*.58,eyeR*.30,0,0,Math.PI*2);ctx.fill();
    }
  });

  // Mouth
  const mY=R*.32;
  if(monState==='eating'||monState==='vomit'){
    // Wide open mouth
    ctx.fillStyle='#100808';
    ctx.beginPath();ctx.ellipse(0,mY+R*.10,R*.46,R*.28,0,0,Math.PI*2);ctx.fill();
    // Teeth top
    ctx.fillStyle='#fffce8';
    for(let ti=-1;ti<=1;ti++){
      ctx.beginPath();
      ctx.roundRect(ti*R*.30-R*.115,mY-R*.10,R*.22,R*.20,R*.04);
      ctx.fill();
    }
    // Tongue
    if(monState!=='vomit'){
      ctx.fillStyle='#e83060';
      ctx.beginPath();ctx.ellipse(0,mY+R*.22,R*.28,R*.14,0,0,Math.PI*2);ctx.fill();
    }
  } else if(monState==='refuse'){
    // Grimace / frown
    ctx.strokeStyle='rgba(20,60,10,.75)';ctx.lineWidth=R*.055;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,mY+R*.06,R*.24,Math.PI+.35,Math.PI*2-.35);ctx.stroke();
    // Little sweat
    ctx.fillStyle='#8ec8e8';
    ctx.beginPath();ctx.moveTo(R*.66,-R*.15);
    ctx.quadraticCurveTo(R*.76,-R*.05,R*.66,R*.06);
    ctx.quadraticCurveTo(R*.56,-R*.05,R*.66,-R*.15);ctx.fill();
  } else {
    // Happy smile
    ctx.strokeStyle='rgba(20,60,10,.70)';ctx.lineWidth=R*.054;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,mY-R*.10,R*.24,0.22,Math.PI-.22);ctx.stroke();
  }

  // Sweat drops (warning)
  if(step>=4&&monState!=='refuse'&&monState!=='vomit'&&monState!=='win'){
    const sw=Math.min((step-3)/5,1.0);
    ctx.globalAlpha=sw;ctx.fillStyle='#90caf9';
    [[-R*.78,-R*.42],[R*.72,-R*.38]].forEach(([sx2,sy])=>{
      ctx.beginPath();ctx.moveTo(sx2,sy);
      ctx.quadraticCurveTo(sx2-R*.07,sy+R*.14,sx2,sy+R*.20);
      ctx.quadraticCurveTo(sx2+R*.07,sy+R*.14,sx2,sy);ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  // Win sparkles
  if(monState==='win'){
    const sp=Math.sin(wt*.12)*Math.PI;
    ctx.strokeStyle='#ffd700';ctx.lineWidth=R*.05;
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2+sp;
      const r1=R*1.15,r2=R*1.45;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* ── DRAW CANDY ────────────────────────────────────────────── */
function drawCandyFly(){
  if(!candyFly||candyFly.dead)return;
  const {x,y,rot,life=1}=candyFly;
  const m=MODES[mod];
  const r=Math.min(W,H)*.05;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=life;

  // Left twist wrapper
  ctx.save();ctx.translate(-r*1.15,0);ctx.rotate(-0.3);
  for(let i=0;i<3;i++){
    ctx.fillStyle=i%2===0?m.candy:m.candyLight;
    ctx.beginPath();ctx.ellipse(0,0,r*.42,r*.18+i*r*.04,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // Right twist wrapper
  ctx.save();ctx.translate(r*1.15,0);ctx.rotate(0.3);
  for(let i=0;i<3;i++){
    ctx.fillStyle=i%2===0?m.candy:m.candyLight;
    ctx.beginPath();ctx.ellipse(0,0,r*.42,r*.18+i*r*.04,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // Main body — rounded rectangle candy body
  const bw=r*1.6,bh=r*1.05;
  ctx.fillStyle=adjustHex(m.candy,-20);
  ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,bh*.45);ctx.fill();

  const cg=ctx.createRadialGradient(-bw*.18,-bh*.22,0,0,0,bw*.72);
  cg.addColorStop(0,m.candyLight);cg.addColorStop(.5,m.candy);
  cg.addColorStop(1,adjustHex(m.candy,-40));
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,bh*.45);ctx.fill();

  // Shine
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.beginPath();ctx.ellipse(-bw*.18,-bh*.22,bw*.22,bh*.14,-.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(-bw*.10,-bh*.10,bw*.38,bh*.22,-.3,0,Math.PI*2);ctx.fill();

  ctx.globalAlpha=1;ctx.restore();
}

/* ── VOMIT PARTICLES ───────────────────────────────────────── */
function createVomit(){
  vomParts=[];
  const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bde','#ff9a3c','#c77dff'];
  const mx=W*.50,my=H*.64;
  for(let i=0;i<22;i++){
    const a=Math.PI*(-.85+Math.random()*1.70)-Math.PI/2;
    const spd=rnd(2.5,6.5)*(H/300);
    vomParts.push({x:mx,y:my,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-rnd(.5,1.8)*(H/300),
      grav:.18*(H/300),col:cols[i%cols.length],sz:rnd(3,7)*(H/300),life:1,dec:rnd(.022,.042)});
  }
}
function updateVomit(){vomParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.97;p.life-=p.dec;});}
function drawVomit(){
  vomParts.forEach(p=>{
    if(p.life<=0)return;
    ctx.globalAlpha=p.life*.88;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ── CONFETTI ──────────────────────────────────────────────── */
function createConfetti(){
  confParts=[];
  const cols=['#00e701','#f5a623','#4d96ff','#ff6bde','#ffd93d','#ffffff'];
  const mx=W*.50,my=H*.42;
  for(let i=0;i<38;i++){
    confParts.push({x:mx+rnd(-W*.15,W*.15),y:my,
      vx:rnd(-3.5,3.5)*(W/680),vy:-(rnd(2.5,5.5))*(H/300),
      grav:.14*(H/300),col:cols[i%cols.length],
      w:rnd(4,10)*(W/680),h:rnd(3,6)*(H/300),rot:rnd(0,Math.PI*2),
      rotSpd:rnd(-.25,.25),life:1,dec:rnd(.012,.022)});
  }
}
function updateConfetti(){confParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.rot+=p.rotSpd;p.life-=p.dec;});}
function drawConfetti(){
  confParts.forEach(p=>{
    if(p.life<=0)return;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=p.life*.9;ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  ctx.globalAlpha=1;
}

/* ── HUNGER BAR ────────────────────────────────────────────── */
function drawHungerBar(){
  const mults=MODES[mod].mults;
  const busts=MODES[mod].busts;
  const modeCol=MODES[mod].color;
  const candy=MODES[mod].candy;
  const candyL=MODES[mod].candyLight;
  const total=mults.length;

  // In idle show first 6 steps; in active show window around current step
  let visStart,visEnd;
  if(phase==='idle'){
    visStart=0; visEnd=Math.min(5,total-1);
  } else {
    visStart=Math.max(0,step-2);
    visEnd=Math.min(total-1,step+4);
  }
  const visCount=visEnd-visStart+1;

  const maxSlotW=W*.88/visCount;
  const slotW=Math.min(maxSlotW, W*.115);
  const slotH=H*.185;
  const pillW=slotW*.86, pillH=slotH*.88;
  const startX=W*.50-(visCount*slotW/2)+slotW*.5;
  const rowY=H*.925;

  ctx.textAlign='center';

  for(let i=visStart;i<=visEnd;i++){
    const ix=i-visStart;
    const cx2=startX+ix*slotW;
    const isDone=i<step&&phase!=='idle';
    const isCurrent=i===step&&phase==='active';

    // Slot bg
    ctx.globalAlpha=isDone?.45:1;
    ctx.fillStyle=isDone?'rgba(0,231,1,.10)':isCurrent?'rgba(255,255,255,.08)':'rgba(255,255,255,.04)';
    ctx.beginPath();ctx.roundRect(cx2-pillW/2,rowY-pillH*.82,pillW,pillH,pillW*.18);ctx.fill();

    if(isCurrent){
      ctx.strokeStyle=modeCol;ctx.lineWidth=1.4;ctx.globalAlpha=.65+Math.sin(wt*.12)*.35;
      ctx.beginPath();ctx.roundRect(cx2-pillW/2,rowY-pillH*.82,pillW,pillH,pillW*.18);ctx.stroke();
      ctx.globalAlpha=1;
    }

    // Icon area
    const cr=slotW*.16;
    const cy2=rowY-pillH*.54;

    if(isDone){
      ctx.strokeStyle='#00e701';ctx.lineWidth=cr*.28;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.globalAlpha=.8;
      ctx.beginPath();ctx.moveTo(cx2-cr*.40,cy2);ctx.lineTo(cx2-cr*.08,cy2+cr*.36);ctx.lineTo(cx2+cr*.40,cy2-cr*.36);ctx.stroke();
    } else {
      // Mini wrapped candy
      ctx.save();ctx.translate(cx2,cy2);
      [-1,1].forEach(side=>{
        ctx.save();ctx.translate(side*cr*.88,0);ctx.rotate(side*.32);
        ctx.fillStyle=isCurrent?candyL:candy;
        ctx.beginPath();ctx.ellipse(0,0,cr*.32,cr*.13,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
      });
      const bw=cr*1.2,bh=cr*.78;
      const cg2=ctx.createRadialGradient(-bw*.14,-bh*.18,0,0,0,bw*.60);
      cg2.addColorStop(0,isCurrent?candyL:candy);
      cg2.addColorStop(1,adjustHex(candy,-30));
      ctx.fillStyle=cg2;
      ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,bh*.4);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath();ctx.ellipse(-bw*.14,-bh*.16,bw*.16,bh*.10,-.3,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // Mult label
    ctx.globalAlpha=isDone?.5:1;
    const mult=mults[i];
    const multStr=mult>=1000?`×${(mult/1000).toFixed(1)}k`:mult>=100?`×${Math.round(mult)}`:mult>=10?`×${mult.toFixed(1)}`:`×${mult.toFixed(2)}`;
    ctx.fillStyle=isDone?'#00e701':isCurrent?'#ffffff':modeCol;
    ctx.font=`bold ${slotW*.155}px Arial`;
    ctx.fillText(multStr,cx2,rowY-pillH*.06);

    ctx.globalAlpha=1;
  }

  // Ellipsis if more steps hidden
  if(visEnd<total-1){
    ctx.fillStyle='rgba(194,212,224,.22)';ctx.font=`${slotW*.13}px Arial`;
    ctx.fillText('···',startX+visCount*slotW-slotW*.15,rowY-pillH*.40);
  }
}

/* ── MULTIPLIER OVERLAY ────────────────────────────────────── */
function drawMultiplierOverlay(){
  const cx=W*.50,cy=H*.175;
  const modeCol=MODES[mod].color;
  let multTxt,multCol,subTxt,subCol;
  const pulseFactor=phase==='active'?(1+Math.sin(wt*.09)*.028):1;

  if(phase==='idle'){
    multTxt='×1.00';multCol='rgba(74,106,122,.7)';subTxt='Nourris le monstre !';subCol='rgba(74,106,122,.5)';
  } else if(phase==='active'){
    multTxt=`×${currentMult.toFixed(2)}`;multCol=modeCol;
    multPulse++;
    subTxt='';subCol='transparent';
  } else if(phase==='busted'){
    multTxt='PERDU';multCol='#e74c3c';subTxt=`Perdu ${currentBet.toFixed(2)} €`;subCol='rgba(231,76,60,.6)';
  } else {
    multTxt=`×${currentMult.toFixed(2)}`;multCol='#00e701';
    subTxt=`+${(currentBet*(currentMult-1)).toFixed(2)} €  Cash Out !`;subCol='rgba(0,231,1,.7)';
  }

  const fs=H*.108*pulseFactor;
  ctx.save();ctx.translate(cx,cy);
  if(phase==='active'&&multPulse<3){ctx.scale(1+multPulse*.04,1+multPulse*.04);if(multPulse===2)multPulse=0;}

  // Glow
  ctx.shadowColor=multCol;ctx.shadowBlur=phase==='active'?H*.06:0;
  ctx.fillStyle=multCol;ctx.font=`bold ${fs}px Arial`;ctx.textAlign='center';
  ctx.fillText(multTxt,0,0);
  ctx.shadowBlur=0;

  // Sub text
  ctx.fillStyle=subCol;ctx.font=`${fs*.21}px Arial`;
  ctx.fillText(subTxt,0,fs*.46);
  ctx.restore();
}

/* ── BACKGROUND ────────────────────────────────────────────── */
function drawBg(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1d2e');bg.addColorStop(.5,'#0b1622');bg.addColorStop(1,'#080f18');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Subtle radial glow at monster position
  ctx.globalAlpha=phase==='active'?.06:.03;
  const rc=ctx.createRadialGradient(W*.50,H*.50,0,W*.50,H*.50,H*.6);
  rc.addColorStop(0,'rgba(255,255,255,1)');rc.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rc;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}

/* ── MAIN DRAW ─────────────────────────────────────────────── */
function drawAll(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  updateVomit();updateConfetti();
  if(candyFly&&!candyFly.dead){
    candyFly.t++;
    const prog=candyFly.t/candyFly.maxT;
    if(!candyFly.bouncing){
      const ep=prog<1?prog:1;
      candyFly.x=lerp(candyFly.sx,candyFly.tx,ep);
      candyFly.y=lerp(candyFly.sy,candyFly.ty,ep)-Math.sin(Math.PI*ep)*H*.20;
      candyFly.rot+=.22;
      // Open mouth as candy approaches
      if(prog>.75&&monState==='idle')monState='eating';
    } else {
      // Bounce back
      const ep=Math.min((candyFly.t-candyFly.bounceAt)/25,1);
      candyFly.x=lerp(candyFly.tx,candyFly.sx,ep);
      candyFly.y=lerp(candyFly.ty,candyFly.sy+H*.12,ep)+Math.sin(Math.PI*ep)*H*.05;
      candyFly.life=1-ep;
      if(ep>=1)candyFly.dead=true;
    }
    if(prog>=1&&!candyFly.bouncing){
      if(candyFly.shouldBust==='refuse'){
        candyFly.bouncing=true;candyFly.bounceAt=candyFly.t;
        monState='refuse';shakeT=0;shakeAmt=1.8;
        playRefuse();
        setTimeout(()=>{monState='idle';shakeAmt=0;},600);
        setTimeout(()=>{endBust();},700);
      } else if(candyFly.shouldBust==='vomit'){
        candyFly.dead=true;
        monState='eating';
        playNom();
        setTimeout(()=>{
          monState='vomit';createVomit();playVomit();
          setTimeout(()=>{monState='idle';endBust();},900);
        },320);
      } else {
        // Success!
        candyFly.dead=true;
        monState='eating';playNom();
        setTimeout(()=>{
          monState=step>=4?'warning':'happy';
          setTimeout(()=>{if(monState!=='refuse'&&monState!=='vomit')monState=step>=4?'warning':'idle';},400);
          finishFeed();
        },280);
      }
    }
  }
  drawMonster();
  drawCandyFly();
  drawVomit();
  drawConfetti();
  drawHungerBar();
  drawMultiplierOverlay();
}

function idle(){
  cancelAnimationFrame(iid);
  function lp(){
    wt+=.018;
    // Blink scheduling
    if(wt-blinkT>nextBlink){blinkT=wt;nextBlink=rnd(180,380);}
    // Idle look direction: pick new target periodically
    if(wt>nextLook){
      lookTX=rnd(-.55,.55);lookTY=rnd(-.35,.25);
      nextLook=wt+rnd(80,220);
    }
    // Smooth look interpolation
    lookX+=(lookTX-lookX)*.055;
    lookY+=(lookTY-lookY)*.055;
    // Gentle bounce: small sine
    bounceOffset=Math.sin(wt*.055)*2.5;
    if(shakeAmt>0)shakeAmt*=.88;
    drawAll();iid=requestAnimationFrame(lp);
  }lp();
}

/* ── GAME LOGIC ────────────────────────────────────────────── */
function getMult(s){const m=MODES[mod].mults;return s>0&&s<=m.length?m[s-1]:1.0;}
function getBustProb(s){const b=MODES[mod].busts;return s<b.length?b[s]:b[b.length-1];}

function getBet(){return Math.max(1,Math.round((parseFloat(document.getElementById('bi').value)||1)*100)/100);}
function adj(f){document.getElementById('bi').value=Math.max(1,Math.round(getBet()*f*100)/100);}
function allIn(){document.getElementById('bi').value=Math.floor(bal);}
function setUI(on){document.getElementById('feedBtn').disabled=!on;document.getElementById('bi').disabled=!on;}

function launchCandy(onArrive){
  // Candy flies from bottom-right area to monster mouth
  const tx=W*.50, ty=H*.56;
  candyFly={sx:W*.62,sy:H*.88,tx,ty,x:W*.62,y:H*.88,t:0,maxT:fast?22:38,rot:0,
            shouldBust:onArrive,bouncing:false,dead:false,life:1};
}

let fast=false;

let resetTid=null; // track auto-reset timeout so we can cancel it

function onFeedClick(){
  if(busy)return;
  ensureAC();

  // If we're in a terminal state, reset immediately before starting new game
  if(phase==='busted'||phase==='cashedout'){
    if(resetTid){clearTimeout(resetTid);resetTid=null;}
    phase='idle';step=0;currentMult=1.0;
    monState='idle';vomParts=[];confParts=[];
    document.getElementById('feedBtn').textContent='🍬 Nourrir';
    document.getElementById('coBtn').disabled=true;
  }

  if(phase==='idle'){
    // Start new game
    currentBet=getBet();
    if(currentBet>bal){document.getElementById('bi').value=Math.floor(bal);return;}
    bal-=currentBet;upd();
    phase='active';step=0;currentMult=1.0;
    document.getElementById('coBtn').disabled=false;
    document.getElementById('feedBtn').textContent='🍬 Nourrir encore';
  }

  if(phase!=='active')return; // safety guard

  // Roll for bust
  busy=true;
  const bust=Math.random()<getBustProb(step);
  if(bust){
    const vomit=step>=2;
    launchCandy(vomit?'vomit':'refuse');
    if(!vomit)setUI(false);
    document.getElementById('coBtn').disabled=true;
  } else {
    launchCandy(null);
    setUI(false);document.getElementById('coBtn').disabled=true;
  }
}

function finishFeed(){
  step++;
  const maxStep=MODES[mod].mults.length;
  currentMult=getMult(step);
  busy=false;

  // Max atteint — gain automatique
  if(step>=maxStep){
    monState='win';createConfetti();playWin(currentMult);
    const win=currentBet*currentMult;
    bal+=win;
    phase='cashedout';
    if(currentBet>st.maxMise)st.maxMise=currentBet;
    st.games++;st.wins++;
    addHist(currentMult,true);upd();
    document.getElementById('coBtn').disabled=true;
    document.getElementById('feedBtn').disabled=true;
    document.getElementById('bi').disabled=true;
    resetTid=setTimeout(()=>{
      resetTid=null;
      phase='idle';step=0;currentMult=1.0;
      monState='idle';confParts=[];
      document.getElementById('feedBtn').textContent='🍬 Nourrir';
      document.getElementById('feedBtn').disabled=false;
      document.getElementById('bi').disabled=false;
      document.getElementById('coBtn').disabled=true;
      upd();
    },2600);
    return;
  }

  setUI(true);
  document.getElementById('coBtn').disabled=false;
  upd();
}

function endBust(){
  phase='busted';
  st.games++;
  addHist(0,false);upd();
  busy=false;setUI(true);
  document.getElementById('feedBtn').textContent='🍬 Rejouer';
  document.getElementById('coBtn').disabled=true;
  // Auto-reset after delay — but can be cancelled if user clicks faster
  resetTid=setTimeout(()=>{
    resetTid=null;
    phase='idle';step=0;currentMult=1.0;
    monState='idle';vomParts=[];
    document.getElementById('feedBtn').textContent='🍬 Nourrir';
    document.getElementById('coBtn').disabled=true;
    upd();
  },2200);
}

function cashout(){
  if(phase!=='active'||step===0||busy)return;
  const win=currentBet*currentMult;
  bal+=win;
  phase='cashedout';
  monState='win';createConfetti();
  playWin(currentMult);
  if(currentBet>st.maxMise)st.maxMise=currentBet;
  st.games++;st.wins++;
  addHist(currentMult,true);upd();
  document.getElementById('coBtn').disabled=true;setUI(false);
  resetTid=setTimeout(()=>{
    resetTid=null;
    phase='idle';step=0;currentMult=1.0;
    monState='idle';confParts=[];
    document.getElementById('feedBtn').textContent='🍬 Nourrir';
    document.getElementById('feedBtn').disabled=false;
    document.getElementById('bi').disabled=false;
    upd();
  },2400);
}

/* ── UI ────────────────────────────────────────────────────── */
function upd(){
  document.getElementById('bal').textContent=Math.round(bal).toLocaleString('fr-FR');
  document.getElementById('sg').textContent=st.games;
  document.getElementById('sw').textContent=st.wins;
  document.getElementById('smx').textContent=st.maxMise>0?st.maxMise+' €':'—';
  // Gain potentiel near cash out
  const gp=document.getElementById('gainPot');
  if(phase==='active'&&step>0){
    const gain=(currentBet*(currentMult-1));
    gp.textContent=`+${gain.toFixed(2)} €`;
    gp.style.opacity='1';
  } else {
    gp.style.opacity='0';
  }
}

// Canvas hover → show chance de gain tooltip for ladder slots
cv.addEventListener('mousemove',e=>{
  if(!MODES[mod])return;
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*devicePixelRatio;
  const my=(e.clientY-rect.top)*devicePixelRatio;
  const m=MODES[mod];
  const total=m.mults.length;
  let visStart,visEnd;
  if(phase==='idle'){visStart=0;visEnd=Math.min(5,total-1);}
  else{visStart=Math.max(0,step-2);visEnd=Math.min(total-1,step+4);}
  const visCount=visEnd-visStart+1;
  const slotW=Math.min(W*.88/visCount,W*.115);
  const slotH=H*.185;
  const pillW=slotW*.86,pillH=slotH*.88;
  const startX=W*.50-(visCount*slotW/2)+slotW*.5;
  const rowY=H*.925;
  let found=false;
  for(let i=visStart;i<=visEnd;i++){
    const ix=i-visStart;
    const cx2=startX+ix*slotW;
    if(mx>=cx2-pillW/2&&mx<=cx2+pillW/2&&my>=rowY-pillH*.82&&my<=rowY+pillH*.20){
      const cumPct=m.cumWin[i];
      const condPct=+(100*(1-m.busts[i])).toFixed(1);
      tt.innerHTML=`Chance depuis le départ : <b>${cumPct}%</b><br>Chance de passer ce palier : ${condPct}%`;
      tt.style.left=(e.clientX+14)+'px';
      tt.style.top=(e.clientY-48)+'px';
      tt.classList.add('show');
      found=true;break;
    }
  }
  if(!found)tt.classList.remove('show');
});
cv.addEventListener('mouseleave',()=>tt.classList.remove('show'));
function addHist(mult,win){
  hist.unshift({mult,win});if(hist.length>16)hist.pop();
  document.getElementById('hl').innerHTML=hist.map(h=>
    `<span class="hp ${h.win?'w':'l'}">${h.win?'×'+h.mult.toFixed(2):'perdu'}</span>`).join('');
}
function toggleSnd(){sndOn=!sndOn;document.getElementById('sndBtn').textContent=sndOn?'Son ON':'Son OFF';}

function buildModes(){
  const g=document.getElementById('dg');g.innerHTML='';
  const tt=document.getElementById('tt');
  Object.entries(MODES).forEach(([key,m],i)=>{
    const d=document.createElement('div');d.className='dbtn'+(key===mod?' act':'');
    d.innerHTML=`<span class="dname">${m.label}</span>`;
    d.style.setProperty('--mode-c',m.color);d.style.setProperty('--mode-bg',m.bg);
    d.onclick=()=>{if(phase!=='idle')return;mod=key;buildModes();};
    const bp=Math.round(m.busts[0]*100);
    d.onmouseenter=()=>{tt.textContent=`Risque au 1er bonbon : ${bp}%`;tt.classList.add('show');};
    d.onmousemove=(e)=>{tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-38)+'px';};
    d.onmouseleave=()=>tt.classList.remove('show');
    g.appendChild(d);
  });
}
buildModes();

(function initBal(){
  const v=parseFloat(localStorage.getItem(NC_KEY));
  if(!isNaN(v)&&v>0){bal=Math.round(v*100)/100;}
  upd();
})();
function saveBal(){localStorage.setItem(NC_KEY,bal);sessionStorage.setItem('nc_came_from_game','1');}
function saveAndBack(e){e.preventDefault();saveBal();window.location.href='index.html';}
window.addEventListener('beforeunload',saveBal);
